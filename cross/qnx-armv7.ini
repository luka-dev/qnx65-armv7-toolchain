# Meson cross file for QNX 6.5 armle-v7 (ARMv7-A, EABI5, softfp).
#   meson setup --cross-file /opt/qnx-cross/qnx-armv7.ini <builddir> <src>
# (or use the qnx-meson host wrapper).

[binaries]
c          = 'arm-unknown-nto-qnx6.5.0eabi-gcc'
cpp        = 'arm-unknown-nto-qnx6.5.0eabi-g++'
ar         = 'arm-unknown-nto-qnx6.5.0eabi-ar'
strip      = 'arm-unknown-nto-qnx6.5.0eabi-strip'
pkg-config = 'pkg-config'

[host_machine]
system     = 'qnx'
cpu_family = 'arm'
cpu        = 'armv7'
endian     = 'little'

[properties]
# target binaries can't run at configure time (no QNX emulator here)
needs_exe_wrapper = true
sys_root          = '/opt/qnx650/target/qnx6'
pkg_config_libdir = '/opt/qnx650/target/qnx6/armle-v7/usr/lib/pkgconfig'

[built-in options]
# force <stddef.h> for gnulib-style code that assumes transitive size_t
c_args   = ['-include', 'stddef.h']
cpp_args = ['-include', 'stddef.h']
